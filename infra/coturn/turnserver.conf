# RemoteTab reference TURN (coturn) — issue #017
#
# Shared-secret REST auth (use-auth-secret). The signaling service mints
# time-limited credentials via POST /turn/credentials; this server never
# needs per-user accounts. NEVER put a static secret in the clients.
#
# Deploy: docker compose up -d  (ports 3478/udp+tcp, 5349/tls, 49160-49200/udp)

listening_port=3478
tls_listening_port=5349

# Public IP of the host (NAT: set both).
# external-ip=203.0.113.10
listening_ip=0.0.0.0

fingerprint

# Static shared secret, injected via env (docker-compose) — same value as the
# signaling service's TURN_SECRET.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Time-limited credentials are enforced by the expiry timestamp in the
# username; keep the realm stable.
realm=remotetab
server-name=remotetab

# Relay port range (open in the firewall; keep as narrow as practical).
min-port=49160
max-port=49200

# Security hardening.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Do not act as an open relay beyond WebRTC allocations.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-0.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging: connection metadata only; no media content passes in plaintext
# (WebRTC packets are DTLS-encrypted end to end).
log-file=stdout
verbose
